name: release

on:
    push:
        branches: [main]
    pull_request:
        types: [closed]
        branches: [main]
    workflow_dispatch:
        inputs:
            prerelease:
                description: 'Cut a prerelease instead of a normal release, e.g. `beta`, `rc`, or `0`'
                required: false
                default: ''
            npm-tag:
                description: 'npm dist-tag to publish to. Set by uppt/release for maintenance lines; leave blank otherwise'
                required: false
                default: ''

permissions: {}

jobs:
    pr:
        if: |
            !github.event.repository.fork
            && (
              (
                github.event_name == 'push'
                && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
              ) || (
                github.event_name == 'workflow_dispatch'
                && !startsWith(github.ref, 'refs/tags/')
              )
            )
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - uses: danielroe/uppt/pr@09882a5a0a1a20a0e802613a77ad59fcb1c1611c # v0.6.9
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  prerelease: ${{ inputs.prerelease }}
                  packages: packages/site-admin

    release:
        if: |
            github.event_name == 'pull_request'
            && github.event.pull_request.merged == true
            && startsWith(github.event.pull_request.head.ref, 'release/v')
            && github.event.pull_request.head.repo.full_name == github.repository
            && !github.event.repository.fork
        runs-on: ubuntu-latest
        concurrency:
            group: release-${{ github.event.pull_request.number }}
            cancel-in-progress: false
        permissions:
            contents: write
            actions: write
        steps:
            - uses: danielroe/uppt/release@09882a5a0a1a20a0e802613a77ad59fcb1c1611c # v0.6.9
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  packages: packages/site-admin

    pack:
        if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        concurrency:
            group: pack-${{ github.ref }}
            cancel-in-progress: false
        permissions: {}
        outputs:
            files: ${{ steps.pack.outputs.files }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: 1.4.2
            - run: bun ci
            - id: pack
              uses: danielroe/uppt/pack@09882a5a0a1a20a0e802613a77ad59fcb1c1611c # v0.6.9
              with:
                  checkout: false
                  install: false
                  packages: packages/site-admin

    publish:
        if: |
            github.event_name == 'workflow_dispatch'
            && startsWith(github.ref, 'refs/tags/v')
            && needs.pack.outputs.files != '[]'
        needs: pack
        runs-on: ubuntu-latest
        concurrency:
            group: publish-${{ github.ref }}
            cancel-in-progress: false
        permissions:
            id-token: write
        environment: npm
        steps:
            - uses: danielroe/uppt/publish@09882a5a0a1a20a0e802613a77ad59fcb1c1611c # v0.6.9
              with:
                  files: ${{ needs.pack.outputs.files }}
                  npm-tag: ${{ inputs.npm-tag }}
