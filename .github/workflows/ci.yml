name: ci

on:
    push:
        branches: [main]
    pull_request:
    merge_group:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.event.pull_request.number || github.sha }}
    cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
    codeql:
        name: CodeQL
        runs-on: ubuntu-latest
        permissions:
            contents: read
            security-events: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with: { persist-credentials: false }
            - uses: github/codeql-action/init@7999b86c43a865dc79d8923397f35af22de63401 # v4
              with:
                  languages: javascript-typescript
                  build-mode: none
            - uses: github/codeql-action/analyze@7999b86c43a865dc79d8923397f35af22de63401 # v4
              with:
                  category: /language:javascript-typescript
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup
            - run: bun run format:check
            - run: bun run lint
            - run: bun run workspace:check
            - run: bun run unused
            - run: bun run typecheck
            - run: bun run test
            - run: bun run build
            - run: bun run package:check
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: site-admin-dist
                  path: packages/site-admin/dist
                  if-no-files-found: error
    nuxt:
        needs: build
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with: { name: site-admin-dist, path: packages/site-admin/dist }
            - run: bun run test:nuxt
    cloudflare:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with: { name: site-admin-dist, path: packages/site-admin/dist }
            - run: bun run test:cloudflare
    consumer:
        needs: build
        strategy:
            fail-fast: false
            matrix:
                package-manager: [bun, npm, pnpm]
        runs-on: ubuntu-latest
        env:
            SITE_ADMIN_PACKAGE_MANAGER: ${{ matrix.package-manager }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - if: matrix.package-manager == 'pnpm'
              run: npm install --global pnpm@10.25.0
            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with: { name: site-admin-dist, path: packages/site-admin/dist }
            - run: bun run test:packed
              env:
                  CHROMIUM_PATH: google-chrome
    check:
        if: always()
        needs: [codeql, build, nuxt, cloudflare, consumer]
        runs-on: ubuntu-latest
        steps:
            - name: Require every blocking job
              env:
                  NEEDS: ${{ toJSON(needs) }}
              run: jq -e 'all(.[]; .result == "success")' <<< "$NEEDS"
